name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend:
    name: Backend CI (Symfony)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: calendria_test
          POSTGRES_USER: calendria_user
          POSTGRES_PASSWORD: calendria_pass
        ports:
          - 5432:5432
        # Wait for postgres to be ready before starting tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, pdo_pgsql, pgsql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies
        run: |
          cd backend
          cp .env.example .env
          composer install --no-progress --no-suggest --prefer-dist

      - name: Setup Test Environment Variables
        run: |
          cd backend
          printf '%s\n' \
            'DATABASE_URL=postgresql://calendria_user:calendria_pass@127.0.0.1:5432/calendria_test?serverVersion=15&charset=utf8' \
            'APP_ENV=test' \
            'APP_SECRET=a3f9e9d28e7c10b27e8a939f82d1b73e' \
            'CORS_ALLOW_ORIGIN=^https?://localhost' \
            'MAILER_DSN=null://null' \
            'MESSENGER_TRANSPORT_DSN=sync://' \
            'JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem' \
            'JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem' \
            'JWT_PASSPHRASE=' \
            'GEMINI_API_KEY=dummy_key_for_tests' \
            'TELEGRAM_BOT_TOKEN=dummy_bot_token' \
            'TELEGRAM_BOT_USERNAME=dummy_bot' \
          > .env.test

      - name: Generate JWT Keys
        run: |
          cd backend
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 2048
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem
          chmod 600 config/jwt/private.pem

      - name: Run Database Migrations
        run: |
          cd backend
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run PHPUnit Tests
        run: |
          cd backend
          vendor/bin/phpunit --configuration phpunit.dist.xml

  frontend:
    name: Frontend CI (React & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build Application (Typecheck & Compile)
        run: |
          cd frontend
          npm run build
